name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/*.test.mjs
      - run: node suites/nda-boundary/run.mjs --report > /dev/null && git diff --exit-code suites/nda-boundary/RESULTS.md
      - run: node analysis/pilot.mjs > /dev/null && git diff --exit-code analysis/PILOT.md analysis/pilot.json
      - run: node analysis/parity.mjs > /dev/null && git diff --exit-code suites/language-parity/RESULTS.md suites/language-parity/results.json
